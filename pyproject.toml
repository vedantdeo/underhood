[project]
name = "underhood"
version = "0.1.0"
description = "LLM internals from scratch, each verified against a reference, and a tool-use fine-tune of Qwen3-4B."
readme = "README.md"
authors = [
    { name = "vedantdeo", email = "vedantdeo1@gmail.com" }
]
requires-python = ">=3.12"
# Only hostllm, for a served token's price, and it installs nothing itself: config and gpu/ need only
# the standard library, so a consumer such as aigent can price a run without installing torch. What
# the models need is in the train and mlx groups, plotting in plot and the kaggle CLI in cloud:
# every `uv sync` here installs them by default, and no consumer does.
dependencies = [
    "hostllm",
]

[project.scripts]
underhood-check = "underhood.device:main"
underhood-fetch = "underhood.data:main"
underhood-fetch-tinystories = "underhood.data:tinystories_main"
underhood-bpe-compare = "underhood.tokenizer.compare:main"
underhood-train = "underhood.training.train:main"
underhood-train-gpu = "underhood.training.train_gpu:main"
underhood-kaggle = "underhood.gpu.kaggle:main"
underhood-hub = "underhood.gpu.hub:main"
underhood-plot-curves = "underhood.training.curves:main"
underhood-gpt2-check = "underhood.model.pretrained:main"
underhood-sample = "underhood.inference.sampling:main"
underhood-kv-bench = "underhood.inference.benchmark:main"
underhood-quant-bench = "underhood.inference.quantization:main"
underhood-toy-lora = "underhood.finetune.toy:main"
underhood-tool-sft = "underhood.finetune.tool_sft:main"
underhood-tool-eval = "underhood.finetune.tool_eval:main"
underhood-tool-data = "underhood.tooldata.build:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
cloud = [
    "kaggle>=2.2.4",
]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-watcher>=0.6.3",
    "ruff>=0.16.6",
]
mlx = [
    "mlx-lm>=0.31.3; sys_platform == 'darwin'",
]
plot = [
    "matplotlib>=3.11.2",
]
train = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.49 ; sys_platform == 'linux'",
    "huggingface-hub>=1.32.0",
    "numpy>=2.5.3",
    "peft>=0.21.2",
    "tiktoken>=0.14.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[tool.uv.sources]
# The serving repo, for its pricing: the chain is aigent → underhood → hostllm.
hostllm = { git = "https://github.com/vedantdeo/hostllm", branch = "main" }

[tool.uv]
default-groups = ["cloud", "dev", "mlx", "plot", "train"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["finetunes"]  # records: scripts kept exactly as they ran

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A"]

[tool.pyright]
exclude = [".venv", "reference", "finetunes"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pytest-watcher]
now = true
clear = true
patterns = ["*.py"]
