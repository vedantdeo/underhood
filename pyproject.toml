[project]
name = "underhood"
version = "0.1.0"
description = "The from-scratch half of the Entropic plan: tokenizers, attention, GPT, KV cache, LoRA, DPO."
readme = "README.md"
authors = [
    { name = "vedantdeo", email = "vedantdeo1@gmail.com" }
]
requires-python = ">=3.12"
# None: config and gpu/ need only the standard library, so a consumer such as aigent can price a run
# without installing torch. What the models need is in the train and mlx groups, and plotting in
# plot: every `uv sync` here installs them by default, and no consumer ever does.
dependencies = []

[project.scripts]
underhood-check = "underhood.device:main"
underhood-fetch = "underhood.data:main"
underhood-fetch-tinystories = "underhood.data:tinystories_main"
underhood-bpe-compare = "underhood.tokenizer.compare:main"
underhood-train = "underhood.training.loop:main"
underhood-train-gpu = "underhood.training.scale:main"
underhood-plot-curves = "underhood.training.curves:main"
underhood-gpt2-check = "underhood.model.pretrained:main"
underhood-sample = "underhood.inference.sampling:main"
underhood-kv-bench = "underhood.inference.benchmark:main"
underhood-quant-bench = "underhood.inference.quantization:main"
underhood-toy-lora = "underhood.finetune.toy:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-watcher>=0.6.3",
    "ruff>=0.16.6",
]
mlx = [
    "mlx-lm>=0.31.3; sys_platform == 'darwin'",
]
plot = [
    "matplotlib>=3.11.2",
]
train = [
    "huggingface-hub>=1.32.0",
    "numpy>=2.5.3",
    "tiktoken>=0.14.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[tool.uv]
default-groups = ["dev", "mlx", "plot", "train"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A"]

[tool.pyright]
exclude = [".venv", "reference"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pytest-watcher]
now = true
clear = true
patterns = ["*.py"]
