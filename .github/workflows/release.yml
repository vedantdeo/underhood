# Snap and roll, twice a week, in IST. A snap branches main as snap-DATE and keeps the last eight;
# a roll, if CI passed there, tags the latest snap's head roll-DATE and moves `stable` to it.
name: snap and roll

on:
  schedule:
    - cron: "30 18 * * 0" # snap, Mon 00:00 IST
    - cron: "30 18 * * 1" # roll, Tue 00:00 IST
    - cron: "30 18 * * 3" # snap, Thu 00:00 IST
    - cron: "30 18 * * 4" # roll, Fri 00:00 IST
  workflow_dispatch:
    inputs:
      step:
        description: which step to run now
        type: choice
        options: [snap, roll]
        required: true

permissions:
  contents: write
  actions: write
  checks: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  KEEP: 8 # snap branches kept: a month of them

jobs:
  release:
    name: snap or roll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide the step and the date
        id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          CHOSEN: ${{ inputs.step }}
        run: |
          case "$SCHEDULE" in
            "30 18 * * 0"|"30 18 * * 3") step=snap ;;
            "30 18 * * 1"|"30 18 * * 4") step=roll ;;
            *) step="$CHOSEN" ;;
          esac
          echo "step=$step" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"

      - name: Snap
        if: steps.plan.outputs.step == 'snap'
        env:
          DATE: ${{ steps.plan.outputs.date }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse origin/main)
          git push -f origin "$sha:refs/heads/snap-$DATE"
          gh workflow run roll.yml --ref "snap-$DATE"
          echo "snapped main at $sha as snap-$DATE"
          git ls-remote --heads origin 'snap-*' | sed 's|.*refs/heads/||' | sort | head -n "-$KEEP" |
            while read -r old; do git push origin --delete "$old"; echo "pruned $old"; done

      - name: Roll
        if: steps.plan.outputs.step == 'roll'
        env:
          DATE: ${{ steps.plan.outputs.date }}
          GH_TOKEN: ${{ github.token }}
        run: |
          snap=$(git ls-remote --heads origin 'snap-*' | sed 's|.*refs/heads/||' | sort | tail -n 1)
          sha=$(git ls-remote origin "refs/heads/$snap" | cut -f1)
          ci=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" --jq \
            '[.check_runs[] | select(.name == "snap / lint · types · tests")]
             | sort_by(.completed_at) | last | .conclusion // "missing"')
          if [ "$ci" != success ]; then
            echo "::error::roll CI on $snap's head $sha is $ci; nothing rolls"
            exit 1
          fi
          git tag -f "roll-$DATE" "$sha"
          git tag -f stable "$sha"
          git push -f origin "refs/tags/roll-$DATE" refs/tags/stable
          echo "rolled $snap at $sha as roll-$DATE, now stable"
